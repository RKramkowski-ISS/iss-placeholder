    <!-- Your Existing Page Functionality -->
    <script>
        function toggleBriefingForm() {
            const form = document.getElementById('executiveForm');
            const toggleBtn = document.getElementById('toggleBriefingBtn');
            
            if (form.classList.contains('hidden')) {
                form.classList.remove('hidden');
                toggleBtn.style.display = 'none';
            }
        }
    </script>

    <!-- First-Party Telemetry & Analytics (Button Clicks & Duration) -->
    <script>
      // 1. Core Event Tracking Function
      function trackEvent(eventName, eventDetails = {}) {
        const payload = JSON.stringify({
          event: eventName,
          details: eventDetails,
          path: window.location.pathname
        });

        // Background delivery to bypass ad-blockers via first-party route
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/telemetry', payload);
        } else {
          fetch('/api/telemetry', {
            method: 'POST',
            body: payload,
            headers: { 'Content-Type': 'application/json' },
            keepalive: true
          });
        }
      }

      // 2. Track Initial Pageview
      document.addEventListener('DOMContentLoaded', () => {
        trackEvent('pageview', { referrer: document.referrer || 'direct' });
      });

      // 3. Track Duration when User Leaves or Switches Tabs
      let sessionStart = Date.now();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          const durationSeconds = Math.round((Date.now() - sessionStart) / 1000);
          trackEvent('session_duration', { seconds: durationSeconds });
        }
      });

      // 4. Wrap Existing Toggle to Track "Request an Executive Briefing" Clicks
      const originalToggle = window.toggleBriefingForm;
      window.toggleBriefingForm = function() {
        trackEvent('click_briefing_toggle');
        if (typeof originalToggle === 'function') {
          originalToggle();
        }
      };
    </script>
</body>
